[project]
name = "loan-shark-bot"
version = "0.1.0"
description = "Discord Bot for in-server Loan Management"
authors = [
    {name = "Tim Davis",email = "binary.god@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "discord-py (>=2.7.1,<3.0.0)",
    "sentry-sdk (>=2.60.0,<3.0.0)",
    "tortoise-orm[accel] (>=1.1.7,<2.0.0)",
    "tzdata (>=2026.2,<2027.0)",
]

[tool.poetry]
package-mode=false

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.14"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
